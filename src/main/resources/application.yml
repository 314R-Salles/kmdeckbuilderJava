auth0:
  # Replace with the audience/identifier you configured
  audience: http://localhost:8080
  # Nom de la connexion Auth0 (Base de données utilisateurs) utilisée pour le changement de mot de passe
  connection: Username-Password-Authentication

spring:
  datasource:
    url: jdbc:mysql://localhost/multiwork?zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=UTC
    username: admin
    password: padmin

  application:
    name: kmdeckbuilder
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      naming.physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  #    defer-datasource-initialization: true
#A decommenter pour executer data.sql une fois puis recommenter.
#  sql:
#    init:
#      mode: always

  # The following is standard Spring Security OAuth2 configuration.
  security:
    oauth2:
      resourceserver:
        jwt:
          # Note the trailing slash is important!
          issuer-uri: https://login.krosmaga.tools/

logging:
  # Stack traces courtes (voir ShortStackTraceConverter). Retirer cette ligne pour retrouver les traces complètes.
  exception-conversion-word: "%shortEx"
  pattern:
    # Id de l'utilisateur connecté sur chaque ligne (voir UserIdLoggingFilter)
    correlation: "[%X{userId:-}] "
#  level:
#    org.springframework.security: TRACE

crossOrigin: http://localhost:4200, https://localhost:4200
